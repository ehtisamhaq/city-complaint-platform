spring:
  application:
    name: complaint-platform
  threads:
    virtual:
      enabled: true
  config:
    import:
      - "optional:file:.env[.properties]"

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/complaints_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5 # keep low for free-tier Neon
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: update              # auto-creates/updates tables; use 'validate' in prod
    show-sql: false
    open-in-view: false # avoids lazy-loading anti-pattern warnings

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.city.complaints: DEBUG
    org.hibernate.SQL: WARN
    # Silence the false-positive Spring Security bean initialization warning
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

# ─── JWT ─────────────────────────────────────────────────────────────────────
# The default is a placeholder. ProductionConfigValidator refuses to start
# under the 'prod' profile while this is still set — export JWT_SECRET to a
# random string of 32+ characters.
jwt:
  secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-characters-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 h

# ─── Claude AI ───────────────────────────────────────────────────────────────
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:300}
  base-url: https://api.anthropic.com

# ─── Mapbox ──────────────────────────────────────────────────────────────────
mapbox:
  token: ${MAPBOX_TOKEN:}

# ─── CORS ────────────────────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
