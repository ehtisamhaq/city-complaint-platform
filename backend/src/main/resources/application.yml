spring:
  application:
    name: complaint-platform
  threads:
    virtual:
      enabled: true
  config:
    import:
      - "optional:file:.env[.properties]"

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/complaints_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5 # keep low for free-tier Neon
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      # Liquibase owns the schema (see spring.liquibase below). 'validate' makes
      # Hibernate check the mapping against the database and fail fast on a
      # mismatch, instead of silently altering a real database on boot. The dev
      # and test profiles override this to 'create-drop' for their in-memory H2.
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    open-in-view: false # avoids lazy-loading anti-pattern warnings

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # No 'baseline-on-migrate' here on purpose. That property existed on
    # LiquibaseProperties up to Boot 3.x but was dropped in Boot 4, so setting
    # it fails startup with a binding error. Adopting Liquibase on a database
    # that already has the tables is handled by a MARK_RAN precondition on each
    # changeset in the baseline instead — see db/changelog/V1__baseline.sql.

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.city.complaints: DEBUG
    org.hibernate.SQL: WARN
    # Silence the false-positive Spring Security bean initialization warning
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

# ─── JWT ─────────────────────────────────────────────────────────────────────
# The default is a placeholder. ProductionConfigValidator refuses to start
# under the 'prod' profile while this is still set — export JWT_SECRET to a
# random string of 32+ characters.
jwt:
  secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-characters-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 h

# ─── Claude AI ───────────────────────────────────────────────────────────────
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:300}
  base-url: https://api.anthropic.com

# ─── Mapbox ──────────────────────────────────────────────────────────────────
mapbox:
  token: ${MAPBOX_TOKEN:}

# ─── CORS ────────────────────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# ─── Cloudinary ──────────────────────────────────────────────────────────────
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
