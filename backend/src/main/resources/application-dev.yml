spring:
  datasource:
    url: jdbc:h2:mem:complaints_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    jpa:
      hibernate:
        ddl-auto: create-drop
      show-sql: false
    liquibase:
      # H2 is a throwaway in-memory database built by Hibernate, so there is
      # nothing to migrate. The changelog targets PostgreSQL.
      enabled: false
    h2:
    console:
      enabled: true
      path: /h2-console
